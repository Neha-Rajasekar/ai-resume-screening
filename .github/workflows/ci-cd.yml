# CI/CD pipeline: every push to main is linted and tested, packaged as a Docker image,
# pushed to GitHub Container Registry (ghcr.io) and deployed to the EC2 instance automatically.
#
# Repository secrets needed (GitHub -> Settings -> Secrets and variables -> Actions):
#   EC2_HOST      public IP of the EC2 instance
#   EC2_SSH_KEY   full contents of the .pem key pair file used to SSH into EC2
# No registry account or password is needed: the workflow's built-in GITHUB_TOKEN
# pushes the image, and is passed to EC2 for the duration of the deploy to pull it.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 app scripts tests wsgi.py --max-line-length 120
      - name: Unit and integration tests
        env:
          EMBEDDER: tfidf    # fast test embedder; the real image uses MiniLM
        run: pytest -v

  build:
    name: Build and push Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry paths must be lower-case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull the new image and restart the container over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io
            docker rm -f resume-app || true
            docker run -d --name resume-app --restart unless-stopped \
              -p 80:5000 --env-file /home/ec2-user/app.env \
              -v embed-cache:/app/data/cache \
              "$IMAGE"
            docker image prune -af --filter "until=24h" || true
            # The first start loads MiniLM; wait until the app answers its health check.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/health; then echo; echo "Deployed $IMAGE"; exit 0; fi
              sleep 5
            done
            echo "Health check failed"; docker logs --tail 50 resume-app; exit 1
